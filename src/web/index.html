<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiskInfo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cdi">
  <div class="menubar" id="menubar"></div>
  <div class="diskbar">
    <button id="preDisk" class="pager hidden" type="button">&#9664;</button>
    <div class="tabs" id="tabs"></div>
    <button id="nextDisk" class="pager hidden" type="button">&#9654;</button>
  </div>
  <div class="workarea">
    <div class="left">
      <div class="box health unknown" id="health">—</div>
      <div class="box temp" id="temp">—</div>
      <div class="box life" id="life">—</div>
    </div>
    <div class="right">
      <div class="headline" id="headline"></div>
      <table class="meta"><tbody id="meta"></tbody></table>
    </div>
    <img id="themeLogo" class="theme-logo hidden" alt="">
  </div>
  <div class="banner hidden" id="banner">
    <span id="bannerText"></span>
    <button id="bannerClose" type="button">×</button>
  </div>
  <div class="statusline">
    <span id="status" class="status"></span>
    <span id="toast" class="toast"></span>
    <span id="alarmIndicator" class="alarm-ind hidden">&#9888;</span>
  </div>
  <div class="attrwrap" id="attrwrap">
    <table class="attrs">
      <thead><tr id="attrhead"></tr></thead>
      <tbody id="attrs"></tbody>
    </table>
  </div>
</div>

<dialog id="dlgSelftest">
  <h3 id="stTitle"></h3>
  <div class="dlg-sub" id="stLast"></div>
  <div class="dlg-row">
    <select id="stType"></select>
    <button id="stStart" type="button"></button>
    <button id="stAbort" type="button"></button>
  </div>
  <pre class="out" id="stOut"></pre>
  <div class="dlg-actions"><button class="close" type="button"></button></div>
</dialog>

<dialog id="dlgAamApm">
  <h3 id="aaTitle"></h3>
  <div class="dlg-sub" id="aaCurrent"></div>
  <div class="dlg-row">
    <label>AAM</label>
    <input id="aaAam" type="number" min="1" max="254">
    <button id="aaAamSet" type="button"></button>
    <button id="aaAamOff" type="button"></button>
    <button id="aaGet" type="button"></button>
  </div>
  <div class="dlg-row">
    <label>APM</label>
    <input id="aaApm" type="number" min="1" max="254">
    <button id="aaApmSet" type="button"></button>
    <button id="aaApmOff" type="button"></button>
  </div>
  <div class="out" id="aaOut"></div>
  <div class="dlg-actions"><button class="close" type="button"></button></div>
</dialog>

<dialog id="dlgGraph" class="wide">
  <h3 id="grTitle"></h3>
  <div class="dlg-row">
    <select id="grMetric"></select>
    <select id="grPoints"></select>
    <button id="grDraw" type="button"></button>
  </div>
  <div id="grDisks" class="checks"></div>
  <div class="graphwrap"><canvas id="grCanvas"></canvas></div>
  <div class="dlg-actions"><button class="close" type="button"></button></div>
</dialog>

<dialog id="dlgSettings" class="wide">
  <h3 id="seTitle"></h3>
  <div id="seBody"></div>
  <div class="dlg-actions">
    <button id="seSave" type="button"></button>
    <button class="close" type="button"></button>
  </div>
</dialog>

<dialog id="dlgAlarms" class="wide">
  <h3 id="alTitle"></h3>
  <div id="alBody"></div>
  <div class="dlg-actions"><button class="close" type="button"></button></div>
</dialog>

<dialog id="dlgAbout">
  <h3 id="abTitle"></h3>
  <div class="about-body" id="abText"></div>
  <div class="dlg-actions"><button class="close" type="button"></button></div>
</dialog>

<input id="themeFile" type="file" accept=".zip" hidden>

<script src="i18n.js"></script>
<script src="graph.js"></script>
<script src="menubar.js"></script>
<script src="theme.js"></script>
<script src="snapshot.js"></script>
<script src="app.js"></script>
</body>
</html>
