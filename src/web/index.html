<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiskInfo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cdi">
  <div class="tabs" id="tabs"></div>
  <div class="headline" id="headline"></div>
  <div class="panel">
    <div class="left">
      <div class="box health unknown" id="health">—</div>
      <div class="box temp" id="temp">—</div>
    </div>
    <table class="meta"><tbody id="meta"></tbody></table>
  </div>
  <div class="toolbar">
    <button id="rescan" type="button"></button>
    <span id="status" class="status"></span>
    <span class="spacer"></span>
    <select id="theme"></select>
  </div>
  <div class="attrwrap">
    <table class="attrs">
      <thead><tr id="attrhead"></tr></thead>
      <tbody id="attrs"></tbody>
    </table>
  </div>
</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
