<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph Options</title>
<link rel="stylesheet" href="option.css">
</head>
<body>
<div id="head"><span id="colorTitle"></span></div>
<table id="colorGrid"></table>
<div id="bgRow">
  <label id="bgLabel"></label>
  <input type="text" id="bgImage" spellcheck="false">
  <button id="bgTheme" type="button"></button>
  <button id="bgClear" type="button"></button>
</div>
<div class="actions">
  <button id="optSave" type="button"></button>
  <button id="optClose" type="button"></button>
</div>
<script src="i18n.js"></script>
<script src="option.js"></script>
</body>
</html>
